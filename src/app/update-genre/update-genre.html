<form class="card p-3 shadow-sm border-0 bg-light">
  <h5 class="mb-3">{{ajout ? 'Ajouter un Genre' : 'Modifier le Genre'}}</h5>
  
  <div [hidden]="ajout" class="mb-3">
    <label class="form-label">ID Genre</label>
    <input type="text" [(ngModel)]="genre.idGenre" name="idGenre" class="form-control" readonly>
  </div>
  
  <div class="mb-3">
    <label class="form-label">Nom Genre</label>
    <input type="text" [(ngModel)]="genre.nomGenre" name="nomGenre" class="form-control" placeholder="Entrez un nom de genre...">
  </div>
  
  <div>
    <button type="submit" [disabled]="!genre.nomGenre" class="btn btn-success" (click)="saveGenre()">
      {{ajout ? 'Ajouter' : 'Modifier'}}
    </button>
  </div>
</form>
