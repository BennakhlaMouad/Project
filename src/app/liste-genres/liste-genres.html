<div class="container mt-5">
  <div class="row">
    
    <!-- Child Component (Add/Edit Form) -->
    <div class="col-md-4 mb-4">
      <app-update-genre
        [genre]="updatedGenre"
        (genreUpdated)="genreUpdated($event)"
        [ajout]="ajout">
      </app-update-genre>
    </div>

    <!-- Parent Table -->
    <div class="col-md-8">
      <div class="card shadow border-0">
        <div class="card-body">
          <table class="table table-striped">
            <thead>
              <tr> 
                <th>Id</th>
                <th>Nom Genre</th> 
                <th>Actions</th> 
              </tr>
            </thead>
            <tbody>
              @for(gen of genres; track gen.idGenre) {
                <tr>
                  <td>{{gen.idGenre}}</td>
                  <td>{{gen.nomGenre}}</td>
                  <td>
                    <button class="btn btn-sm btn-outline-success" (click)="updateGen(gen)">Editer</button>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
